[platformio]
src_dir = src
default_envs = pc

[env:pc]
platform = native
build_flags = -std=c++17 -Wall -Wextra -pthread
build_unflags = -std=gnu++11

[env:pc-test]
platform = native
build_flags = -std=c++17 -Wall -Wextra -pthread
build_unflags = -std=gnu++11
test_framework = doctest
build_src_filter = +<**/*> -<main.cpp>
lib_extra_dirs = ${PROJECT_DIR}/src
lib_ldf_mode = chain+
