[platformio]
src_dir = src
default_envs = pc

# Shared deps for every env. Registry-available libs go here (see ADR 0002);
# non-registry libs are vendored under lib/ (see ADR 0001).
[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1

[env:pc]
platform = native
build_flags = -std=c++17 -Wall -Wextra -pthread
build_unflags = -std=gnu++11

[env:pc-test]
platform = native
build_flags = -std=c++17 -Wall -Wextra -pthread
build_unflags = -std=gnu++11
test_framework = doctest
build_src_filter = +<**/*> -<main.cpp>
lib_extra_dirs = ${PROJECT_DIR}/src
lib_ldf_mode = chain+

# ESP32 envs — shared platform + framework + lib_deps. Each concrete env
# below extends this via `extends = esp32_common`. Frugality note: no
# WIFI_LOLIN_FIX, no Ethernet defines, no LittleFS partition table — those
# belong to features v2 has not landed yet (WiFi in Sprint 5, light pipeline
# in Sprint 6). Each lands with its first consumer.
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
build_flags = -std=c++17
build_unflags = -std=gnu++11
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
# chain mode (without +) scans only direct lib_deps. chain+ follows transitive
# #includes through project headers, which on pioarduino 55 pulls WiFi.cpp
# into the build before its sibling Network/ library is on CPPPATH — and
# Network has no LDF metadata, so the build dies finding Network.h. Plain
# `chain` skips that trap; ESPAsyncWebServer is in lib_deps directly so its
# own deps (AsyncTCP) still resolve via library.json.
lib_ldf_mode = chain
# soft compat lets framework-internal libs link even when their metadata is
# incomplete; lib_ignore excludes RP/ESP TCP backends so the wrong AsyncTCP
# is not pulled in alongside ESPAsyncWebServer.
lib_compat_mode = soft
lib_ignore = RPAsyncTCP, ESPAsyncTCP
lib_deps =
    ${env.lib_deps}
    ESP32Async/ESPAsyncWebServer @ ^3.10.3

[env:esp32dev]
extends = esp32_common
board = esp32dev
# Custom 4 MB partition: OTA pair (1.75 MB each) + 384 KB LittleFS + 64 KB
# coredump. Inherited verbatim from v1. OTA lands in Sprint 7, LittleFS in
# Sprint 5; the partition is sized for them now so neither sprint has to
# reflash a fresh layout (and lose state).
board_build.partitions = partitions/esp32dev.csv

# ESP32-S3-N16R8 — 16 MB flash, 8 MB octal PSRAM. USB-CDC serial on boot
# so the device shows as /dev/cu.usbmodem* and Serial.print survives reset.
[env:esp32s3_n16r8]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = ${esp32_common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
