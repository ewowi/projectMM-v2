site_name: projectMM v2
site_url: https://ewowi.github.io/projectMM-v2
site_description: Cross-platform runtime for modular, loop-driven processes
site_author: MoonModules

repo_name: ewowi/projectMM-v2
repo_url: https://github.com/ewowi/projectMM-v2

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - User Guide:
    - Overview: user-guide/index.md
    - System:
      - SystemStatusModule: user-guide/system/system-status.md
      - WifiStaModule:      user-guide/system/wifi-sta.md
      - StateStoreModule:   user-guide/system/state-store.md
    - Network:
      - HttpServerModule:   user-guide/network/http-server.md
      - WebSocketModule:    user-guide/network/web-socket.md
    - Lights:
      - RipplesEffect:      user-guide/lights/ripples-effect.md
      - PreviewModule:      user-guide/lights/preview.md
      - ArtnetOutModule:    user-guide/lights/artnet-out.md
  - Architecture:
    - Overview: architecture/index.md
    - System: architecture/system.md
    - Process: architecture/process.md
    - Product: architecture/product.md
  - Developer Guide:
    - Overview: developer-guide/index.md
    - Deploy: developer-guide/deploy.md
    - Backend: developer-guide/backend.md
    - Frontend: developer-guide/frontend.md
    - Pal inventory: developer-guide/pal.md
    - What we test: developer-guide/tests.md
    - ADRs:
      - 0001 — Vendor cpp-httplib: developer-guide/adr/0001-vendor-cpp-httplib.md
      - 0002 — ArduinoJson via lib_deps: developer-guide/adr/0002-arduinojson-lib-deps.md
      - 0003 — DataRing + DataRegistry in core: developer-guide/adr/0003-dataring-dataregistry-in-core.md
      - 0004 — Track .claude/agents/: developer-guide/adr/0004-claude-agents-tracked.md
      - 0005 — DataBuffer teardown liveness: developer-guide/adr/0005-databuffer-teardown-liveness.md
      - 0006 — Per-effect LOC budgets: developer-guide/adr/0006-per-effect-loc-budgets.md
      - 0007 — Parent-input matches category: developer-guide/adr/0007-parent-input-matches-category.md
      - 0008 — Product requirements constraint: developer-guide/adr/0008-product-requirements-constraint.md
  - Development:
    - Overview: development/index.md
    - Release 1 — Foundation: development/release-01.md
    - Backlog: development/backlog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
