<!-- Side nav: lists root modules; clicking one shows it -->
<nav id="side-nav">
  <div id="nav-links"></div>
  <div class="nav-footer">
    <button id="add-root-btn" class="add-btn" style="width:100%;font-size:0.8rem;padding:0.3rem 0.5rem;">+ add module</button>
    <div id="root-picker-area"></div>
  </div>
</nav>
<div id="nav-overlay"></div>

<section id="preview-section">
  <canvas id="preview" width="16" height="16"></canvas>
</section>

<div id="modules"></div>
<div id="canvas-view" style="display:none">
  <div id="canvas-viewport">
    <svg id="canvas-svg"></svg>
    <div id="canvas-world"></div>
  </div>
  <div id="canvas-sidebar"></div>
</div>

<!-- Part F: System health panel -->
<div id="health-section">
  <details id="health-details">
    <summary>
      System health
      <span id="health-badge">—</span>
    </summary>
    <table id="health-table"><tbody id="health-tbody"></tbody></table>
  </details>
</div>

<!-- Part G: Log panel — shows messages pushed via WS {"t":"log","m":"..."} -->
<div id="log-section">
  <details id="log-details">
    <summary>
      Log
      <span id="log-count">0</span>
      <button id="log-clear" title="clear log">clear</button>
    </summary>
    <div id="log-output"></div>
  </details>
</div>

<script src="app.js"></script>
</body>
</html>
