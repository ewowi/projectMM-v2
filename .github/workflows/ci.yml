name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  guardrails:
    name: Guardrail checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/checks/check_loc.py
      - run: uv run scripts/checks/check_hot_path.py
      - run: uv run scripts/checks/check_gpio.py
      - run: uv run scripts/checks/check_structure.py
      - run: uv run scripts/checks/check_platform_guards.py
      - run: uv run scripts/checks/check_bundle.py

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        env: [pc, esp32dev, esp32s3_n16r8]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install PlatformIO
        run: uv sync --extra ci
      - name: Build
        run: uv run scripts/build/build.py ${{ matrix.env }}
      - name: Test
        if: matrix.env == 'pc'
        run: uv run scripts/build/test.py
